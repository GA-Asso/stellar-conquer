[workspace]
resolver = "2"
members = ["conquest", "armory", "vault"]

[workspace.dependencies]
soroban-sdk = "25.3.2"
ed25519-dalek = "2"

# Perfil recomendado por Stellar: WASM pequeño (menos tarifa de subida y de instancia)
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
